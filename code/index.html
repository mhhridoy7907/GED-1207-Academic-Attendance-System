<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GED 1207</title>

<link rel="stylesheet" href="style/index.css">

</head>


<body>

<div class="container">

<main class="card">




<div class="brand">

    <div class="logo">
        A
    </div>

    <h1>
        Academic Attendance
    </h1>

    <div class="subtitle">
        Student Attendance Portal
    </div>

</div>




<section class="course-box">

    <div class="course-top">

        <span class="course-badge">Course Information </span>

        <span class="course-code"> GED 1207</span>

    </div>


    <div class="course-title">

        Academic Proficiency:
        Writing and Presentation
        Skills in English

    </div>


    <div class="teacher">

        <div class="teacher-icon">
            👨‍🏫
        </div>

        <div>

            <div class="teacher-label">
                Course Teacher
            </div>

            <div class="teacher-name">
                S.A.M. Thahmid
            </div>

        </div>

    </div>

</section>



<div id="status" class="status">

    Checking class...

</div>



<form id="attendanceForm" class="form-section">




<div class="field">

    <label>
        Student ID
    </label>

    <input id="studentId" type="text" inputmode="numeric"  maxlength="16"
        placeholder="Enter 16 digit Student ID"
        required
    >

</div>


<!-- NAME -->

<div class="field">

    <label>
        Student Name
    </label>

    <input
        id="studentName"
        type="text"
        maxlength="100"
        placeholder="Enter your full name"
        required
    >

</div>


<!-- DEPARTMENT -->

<div class="field">

    <label>
        Department
    </label>

    <select
        id="department"
        required
    >

        <option value="">
            Select Department
        </option>

        <option value="CSE">
            CSE
        </option>

        <option value="EEE">
            EEE
        </option>

        <option value="ENGLISH">
            English
        </option>

        <option value="BDPH">
            BDPH
        </option>

        <option value="FASHION DESIGN">
            Fashion Design
        </option>

        <option value="BBA">
            BBA
        </option>

    </select>

</div>


<!-- LEVEL -->

<div class="field">

    <label>
        Level
    </label>

    <select
        id="level"
        required
    >

        <option value="">
            Select Level
        </option>

        <option value="1.1">1.1</option>
        <option value="1.2">1.2</option>
        <option value="2.1">2.1</option>
        <option value="2.2">2.2</option>
        <option value="3.1">3.1</option>
        <option value="3.2">3.2</option>
        <option value="4.1">4.1</option>
        <option value="4.2">4.2</option>

    </select>

</div>


<!-- CLASS CODE -->

<div class="field">

    <label>
        Class Code
    </label>

<input id="classCode" type="text"inputmode="numeric" maxlength="4" placeholder="Enter 4 digit class code" required >

</div>


<!-- SUBMIT -->

<button id="submitBtn" type="submit" disabled>
    Submit Attendance
</button>

</form>
<div id="message" class="message"></div>

<div class="footer">

    <strong>GED 1207</strong>
    • Academic Attendance Portal

    <br>

    Writing & Presentation Skills in English

</div>


</main>

</div>


<script type="module" src="script/index.js"></script>

</body>
</html>
